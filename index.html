<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="A keyboard-first 3D type playground. Press a key, watch the letter fall." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230a0a0a'/%3E%3Ctext x='50' y='72' font-size='64' font-family='monospace' font-weight='bold' text-anchor='middle' fill='%2322c55e'%3E%E2%86%93%3C/text%3E%3C/svg%3E" />
    <title>typefall</title>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <!-- Invisible input keeps the mobile soft-keyboard open -->
    <input
      id="capture"
      type="text"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="none"
      spellcheck="false"
      aria-hidden="true"
      tabindex="-1"
    />
    <div id="hud">
      <span class="hint">type <span class="dot">·</span> enter drops the word <span class="dot">·</span> drag to throw</span>
      <span class="count"><span id="count">0</span> letters</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
